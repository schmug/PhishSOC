# git-cliff configuration for PhishSOC
# https://git-cliff.org/docs/configuration
#
# Conventional commit prefixes in use:
#   feat:, fix:, refactor:, test:, chore:, docs:, security:, seo:

[changelog]
# Header text placed at the top of the changelog
header = """
# Changelog

All notable changes to PhishSOC are documented in this file.

This file is auto-maintained by [git-cliff](https://git-cliff.org/) using
conventional commits. For a machine-readable feed, see the GitHub Releases page.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# Tera template for each release section
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/schmug/PhishSOC/commit/{{ commit.id }}))\
{% if commit.breaking %} **[BREAKING]**{% endif %}
{% endfor %}
{% endfor %}\n
"""

# Footer appended after all release sections
footer = """
<!-- generated by git-cliff -->
"""

# Do not include commits that match no parser group
trim = true

[git]
# Parse commits as conventional commits
conventional_commits = true

# Ignore commits that do not match conventional format
filter_unconventional = true

# Process each line of multi-paragraph commit messages
split_commits = false

# Protect breaking change commits from being excluded
protect_breaking_commits = true

# Only include commits reachable from the latest tag
filter_commits = false

# Glob pattern for matching git tags
tag_pattern = "v[0-9]*"

# Skip commits whose tag matches this pattern (pre-releases)
skip_tags = "v0.0.0-rc[0-9]*"

# Ignore tags matching this pattern (e.g. build-automation tags)
ignore_tags = ""

# Sort tags topologically instead of chronologically
topo_order = false

# Sort commits inside a release section
sort_commits = "oldest"

# Map conventional commit types to changelog groups
commit_parsers = [
  # Security-related changes (custom prefix used in this project)
  { message = "^security", group = "Security", default_scope = "security" },

  # New features
  { message = "^feat", group = "Features" },

  # Bug fixes
  { message = "^fix", group = "Bug Fixes" },

  # Refactoring (no functional change)
  { message = "^refactor", group = "Refactoring" },

  # Tests
  { message = "^test", group = "Testing" },

  # Documentation
  { message = "^docs", group = "Documentation" },

  # SEO changes (custom prefix used in this project)
  { message = "^seo", group = "SEO" },

  # Maintenance / housekeeping
  { message = "^chore", group = "Miscellaneous" },

  # Catch-all: skip commits that don't match any group above
  { message = ".*", skip = true },
]
